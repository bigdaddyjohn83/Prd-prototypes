<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful To-Do List</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            --container-bg: #ffffff;
            --text-color: #333;
            --title-color: #ff6b6b;
            --input-bg: #ffffff;
            --input-border: #ffdde1;
            --input-focus: #ff6b6b;
            --task-bg: #f8f9fa;
            --task-border: #4facfe;
            --task-completed-bg: #f1f8f5;
            --task-completed-border: #43e97b;
            --task-completed-text: #888;
            --empty-color: #888;
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #1f1c2c 0%, #928DAB 100%);
            --container-bg: #2a2a3c;
            --text-color: #f1f1f1;
            --title-color: #ff8e8e;
            --input-bg: #1f1f2e;
            --input-border: #44445c;
            --input-focus: #ff8e8e;
            --task-bg: #35354e;
            --task-border: #00d2ff;
            --task-completed-bg: #22332a;
            --task-completed-border: #38ef7d;
            --task-completed-text: #aaa;
            --empty-color: #aaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--container-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--title-color);
            font-size: 2.8rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .task-counter {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-color);
            opacity: 0.8;
            margin-bottom: 20px;
            text-align: center;
        }

        .theme-btn {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            color: #333;
            border: none;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        body.dark-mode .theme-btn {
            background: linear-gradient(135deg, #434343 0%, #000000 100%);
            color: #fff;
        }

        .theme-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 3px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-color);
            border-radius: 12px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--input-focus);
        }

        button.add-btn {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(253, 160, 133, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button.add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(253, 160, 133, 0.6);
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--task-bg);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 6px solid var(--task-border);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        li.completed {
            border-left-color: var(--task-completed-border);
            background: var(--task-completed-bg);
        }

        li.completed span {
            text-decoration: line-through;
            color: var(--task-completed-text);
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #43e97b;
        }

        span {
            font-size: 1.1rem;
            color: var(--text-color);
            word-break: break-all;
        }

        .delete-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #d63031;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(255, 154, 158, 0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .delete-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            color: white;
        }

        .empty-state {
            text-align: center;
            color: var(--empty-color);
            font-style: italic;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1>✨ My To-Do List ✨</h1>
            <button id="themeBtn" class="theme-btn">🌙 Dark</button>
        </div>
        <div id="taskCounter" class="task-counter">0 tasks remaining</div>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
            <button id="addBtn" class="add-btn">Add Task</button>
        </div>
        <ul id="taskList"></ul>
        <div id="emptyState" class="empty-state">No tasks yet! Add one above 🚀</div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const themeBtn = document.getElementById('themeBtn');
        const taskCounter = document.getElementById('taskCounter');

        // Load tasks and theme from localStorage on startup
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        const currentTheme = localStorage.getItem('theme') || 'light';

        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeBtn.textContent = '☀️ Light';
        }

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeBtn.textContent = isDark ? '☀️ Light' : '🌙 Dark';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        function saveAndRender() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;

            tasks.push({ text: text, completed: false });
            taskInput.value = '';
            saveAndRender();
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveAndRender();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveAndRender();
        }

        function renderTasks() {
            taskList.innerHTML = '';
            
            const remainingCount = tasks.filter(t => !t.completed).length;
            if (tasks.length === 0) {
                taskCounter.textContent = 'No tasks yet!';
            } else if (remainingCount === 0) {
                taskCounter.textContent = '🎉 All tasks completed!';
            } else {
                taskCounter.textContent = `${remainingCount} task${remainingCount === 1 ? '' : 's'} remaining`;
            }

            if (tasks.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                if (task.completed) {
                    li.classList.add('completed');
                }

                const contentDiv = document.createElement('div');
                contentDiv.className = 'task-content';
                contentDiv.onclick = () => toggleTask(index);

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = task.completed;
                checkbox.onclick = (e) => {
                    e.stopPropagation();
                    toggleTask(index);
                };

                const span = document.createElement('span');
                span.textContent = task.text;

                contentDiv.appendChild(checkbox);
                contentDiv.appendChild(span);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteTask(index);
                };

                li.appendChild(contentDiv);
                li.appendChild(deleteBtn);
                taskList.appendChild(li);
            });
        }

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Initial render
        renderTasks();
    </script>
</body>
</html>
